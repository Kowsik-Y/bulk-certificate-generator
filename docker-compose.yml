services:
  redis:
    image: redis:7-alpine
    container_name: certificate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: certificate_rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"  # RustFS S3 API
      - "9001:9001"  # RustFS Web Management Console
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs_data:/data
    command: ["/data"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/certificates.db
      - OUTPUT_DIR=/data/output
      - STORAGE_BACKEND=rustfs
      - S3_ENDPOINT_URL=http://rustfs:9000
      - S3_ACCESS_KEY_ID=rustfsadmin
      - S3_SECRET_ACCESS_KEY=rustfsadmin
      - S3_BUCKET_NAME=certificates
      - S3_REGION_NAME=us-east-1
    volumes:
      - app_data:/data
      - ./output:/data/output
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/certificates.db
      - OUTPUT_DIR=/data/output
      - STORAGE_BACKEND=rustfs
      - S3_ENDPOINT_URL=http://rustfs:9000
      - S3_ACCESS_KEY_ID=rustfsadmin
      - S3_SECRET_ACCESS_KEY=rustfsadmin
      - S3_BUCKET_NAME=certificates
      - S3_REGION_NAME=us-east-1
    volumes:
      - app_data:/data
      - ./output:/data/output
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info"]

volumes:
  redis_data:
  app_data:
  rustfs_data:
